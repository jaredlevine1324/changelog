# .github/workflows/changelog.yml
# GitHub Action that runs automatically on 14th and 2nd-to-last day of each month

name: Generate Product Changelog

on:
  schedule:
    # Run on 14th of every month at 9 AM UTC (day before mid-month)
    - cron: '0 9 14 * *'
    # Run on 27th-30th of every month at 9 AM UTC (to catch 2nd-to-last day)
    - cron: '0 9 27-30 * *'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Check if today is 2nd-to-last day of month or 14th
        id: check_date
        run: |
          today=$(date +%d)
          tomorrow=$(date -d "+1 day" +%d)
          day_after=$(date -d "+2 days" +%d)
          # If day after tomorrow is 1st, then tomorrow is last day, so today is 2nd-to-last
          # OR if today is 14th
          if [ "$day_after" = "01" ] || [ "$today" = "14" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run changelog generator
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node changelog-generator.js
      
      - name: Skip notification
        if: steps.check_date.outputs.should_run == 'false'
        run: echo "Not the 14th or 2nd-to-last day of month. Skipping changelog generation."
