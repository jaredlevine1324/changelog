# .github/workflows/changelog.yml
# GitHub Action that runs automatically on the 3rd Thursday of every month

name: Generate Product Changelog

on:
  schedule:
    # Run on Thursdays at 9 AM UTC
    - cron: '0 9 * * 4'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Check if today is 3rd Thursday of month
        id: check_date
        run: |
          # Get current date info
          day=$(date +%d)
          month=$(date +%m)
          year=$(date +%Y)
          
          # Find all Thursdays in the current month
          thursday_count=0
          third_thursday_day=0
          
          for d in {1..31}; do
            # Check if this day exists in current month and is a Thursday
            if date -d "$year-$month-$d" "+%u" 2>/dev/null | grep -q "4"; then
              thursday_count=$((thursday_count + 1))
              if [ $thursday_count -eq 3 ]; then
                third_thursday_day=$d
                break
              fi
            fi
          done
          
          # Check if today is the 3rd Thursday
          if [ "$day" = "$third_thursday_day" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Today is the 3rd Thursday (day $day)"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Not the 3rd Thursday. 3rd Thursday is day $third_thursday_day, today is day $day"
          fi
      
      - name: Run changelog generator
        if: steps.check_date.outputs.should_run == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node changelog-generator.js
      
      - name: Skip notification
        if: steps.check_date.outputs.should_run == 'false'
        run: echo "Not the 3rd Thursday of the month. Skipping changelog generation."
